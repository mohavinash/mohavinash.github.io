    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff4d2" stop-opacity="1"/>
      <stop offset=".72" stop-color="#fff4d2" stop-opacity=".96"/>
      <stop offset="1" stop-color="#fff4d2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sceneClip"><rect x="580" y="0" width="620" height="630"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="#fff4d2"/>
  <image x="520" y="0" width="945" height="630" preserveAspectRatio="xMidYMid slice" href="assets/pixel/counterfactual-railway.webp" xlink:href="assets/pixel/counterfactual-railway.webp" clip-path="url(#sceneClip)"/>
