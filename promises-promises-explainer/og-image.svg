    <text x="75" y="77" fill="#211d45" font-size="17" font-weight="700" letter-spacing="1">DATACHUTNEY / PAPER QUEST</text>
    <text x="55" y="205" fill="#b83f2c" font-size="76" font-weight="900" letter-spacing="-6">PROMISES,</text>
    <text x="55" y="282" fill="#211d45" font-size="76" font-weight="900" letter-spacing="-6">PROMISES</text>
    <rect x="55" y="315" width="570" height="8" fill="#ef6b3a"/>
