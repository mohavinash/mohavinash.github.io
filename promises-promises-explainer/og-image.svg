<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Promises, Promises</title>
  <desc id="desc">A pixel-art interactive guide to a working paper on governance and growth in India under Modi and the BJP.</desc>
  <defs>
